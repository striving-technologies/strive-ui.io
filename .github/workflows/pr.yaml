name: PR Check
on: [pull_request]

jobs:
  test-components:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history for codecov

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test Components
        run: yarn test

  lint-ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint TS
        run: yarn lint-ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  commitlint:
    runs-on: ubuntu-latest
    # Dependabot's grouped commit messages exceed the header limit by design; don't lint bot commits.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history so commitlint can walk the PR range

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.mjs
